<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Chat SignalR Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      #messages {
        border: 1px solid #ccc;
        padding: 10px;
        height: 300px;
        overflow-y: scroll;
      }
      #userInput {
        width: 100px;
        margin-right: 10px;
      }
      #messageInput {
        width: 300px;
        margin-right: 10px;
      }
      button {
        padding: 5px 10px;
      }
    </style>
  </head>
  <body>
    <h1>Chat SignalR Test</h1>
    <div id="messages"></div>
    <input type="text" id="userInput" placeholder="Tên người dùng" />
    <input type="text" id="messageInput" placeholder="Tin nhắn" />
    <button id="sendButton">Gửi</button>

    <!-- Thư viện SignalR JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script>
      const connection = new signalR.HubConnectionBuilder()
        .withUrl("https://localhost:7299/chatHub", {
          // Giữ HTTPS và port đúng
          withCredentials: false, // <-- Thêm dòng này để tắt credentials
        })
        .build();

      // Nhận tin nhắn từ server
      connection.on("ReceiveMessage", (user, message) => {
        const msg = document.createElement("div");
        msg.textContent = `${user}: ${message}`;
        document.getElementById("messages").appendChild(msg);
      });

      // Kết nối
      connection
        .start()
        .then(() => {
          console.log("Kết nối thành công!");
        })
        .catch((err) => console.error(err));

      // Gửi tin nhắn
      document.getElementById("sendButton").addEventListener("click", () => {
        const user = document.getElementById("userInput").value;
        const message = document.getElementById("messageInput").value;
        if (user && message) {
          connection
            .invoke("SendMessageAsync", user, message)
            .then(() => {
              document.getElementById("messageInput").value = "";
            })
            .catch((err) => console.error(err));
        }
      });
    </script>
  </body>
</html>
